<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=/frontend/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crypto Signal Dashboard</title>
    <link rel="stylesheet" href="https://schnueddels.de/assets/css/schnueddels-ui.css?v=20260508a" data-sd-ui-css="true">
    <script defer src="https://schnueddels.de/assets/js/schnueddels-header.js?v=20260508a" data-project="Crypto"></script>
  </head>
<body class="sd-app">
    <main class="sd-shell sd-section" style="min-height:100vh;display:grid;place-items:center;">
      <section class="sd-card" style="max-width:760px;margin:0 auto;padding:clamp(24px,4vw,40px);display:grid;gap:16px;">
        <p class="sd-eyebrow">Crypto</p>
        <h1 style="margin:0;font-size:clamp(2rem,4vw,3.4rem);line-height:1.04;">Crypto Signal Dashboard</h1>
        <p style="margin:0;max-width:56ch;color:var(--sd-text-soft, var(--sd-text-muted, #5f6980));font-size:1.05rem;">
          Weiterleitung zur kompakten Frontend-Oberfläche mit den aktuellen Markt-Signalen.
        </p>
        <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
          <a class="sd-button sd-button--primary" href="/frontend/">Dashboard öffnen</a>
          <span style="display:inline-flex;align-items:center;padding:10px 14px;border-radius:999px;border:1px solid var(--sd-border, rgba(154,170,196,.26));background:var(--sd-surface-2, rgba(255,255,255,.62));color:var(--sd-text-soft, #5f6980);font-weight:700;">Auto-Redirect aktiv</span>
        </div>
      </section>
    </main>
  </body>
</html>
